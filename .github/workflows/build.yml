name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libasound2-dev libjack-jackd2-dev libfreetype6-dev \
            libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Render test (macOS / Windows)
        if: runner.os != 'Linux'
        working-directory: build
        shell: bash
        run: |
          exe=$(find MeerumRenderTest_artefacts -type f \( -name MeerumRenderTest -o -name MeerumRenderTest.exe \) | head -1)
          "$exe" test-renders

      - name: Render test (Linux)
        if: runner.os == 'Linux'
        working-directory: build
        run: xvfb-run -a ./MeerumRenderTest_artefacts/Release/MeerumRenderTest test-renders

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: Meerum-${{ matrix.name }}
          path: |
            build/Meerum_artefacts/Release/VST3
            build/Meerum_artefacts/Release/AU
            build/Meerum_artefacts/Release/LV2
            build/Meerum_artefacts/Release/Standalone
          if-no-files-found: warn
