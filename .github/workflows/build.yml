name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libasound2-dev libjack-jackd2-dev libfreetype6-dev \
            libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Render test (macOS / Windows)
        if: runner.os != 'Linux'
        working-directory: build
        shell: bash
        run: |
          exe=$(find MeerumRenderTest_artefacts -type f \( -name MeerumRenderTest -o -name MeerumRenderTest.exe \) | head -1)
          "$exe" test-renders

      - name: Render test (Linux)
        if: runner.os == 'Linux'
        working-directory: build
        run: xvfb-run -a ./MeerumRenderTest_artefacts/Release/MeerumRenderTest test-renders

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || version="dev-${GITHUB_SHA::7}"
          out="Meerum-${version}-${{ matrix.name }}"
          art=build/Meerum_artefacts/Release
          mkdir -p "dist/$out"
          cp -R "$art/VST3/Meerum.vst3" "dist/$out/"
          cp LICENSE README.md "dist/$out/"
          case "${{ runner.os }}" in
            macOS)
              cp -R "$art/AU/Meerum.component" "$art/Standalone/Meerum.app" "dist/$out/"
              # Re-seal with an ad-hoc signature: JUCE adds files to the bundles after linking,
              # which leaves the original seal invalid and makes macOS report them as damaged.
              for b in "dist/$out/Meerum.vst3" "dist/$out/Meerum.component" "dist/$out/Meerum.app"; do
                codesign --force --deep --sign - "$b"
              done
              xattr -cr "dist/$out"
              (cd dist && ditto -c -k --norsrc --noextattr --keepParent "$out" "$out.zip") ;;
            Windows)
              cp "$art/Standalone/Meerum.exe" "dist/$out/"
              (cd dist && 7z a -tzip "$out.zip" "$out" > /dev/null) ;;
            Linux)
              cp -R "$art/LV2/Meerum.lv2" "dist/$out/"
              cp "$art/Standalone/Meerum" "dist/$out/"
              (cd dist && tar -czf "$out.tar.gz" "$out") ;;
          esac
          rm -rf "dist/$out"
          ls -la dist

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Meerum-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: Meerum-*
          merge-multiple: true
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* --title "Meerum $GITHUB_REF_NAME" --notes-file .github/release-notes.md
